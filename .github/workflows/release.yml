name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    uses: ./.github/workflows/build-linux.yml

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VidGrab-windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: VidGrab-linux
          path: release-linux

      - name: Prepare release assets
        run: |
          mv release-linux/VidGrab "release/VidGrab-linux"
          mv release-linux/VidGrab-linux.tar.xz "release/VidGrab-linux.tar.xz"
          chmod +x "release/VidGrab-linux"
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VidGrab ${{ github.ref_name }}
          body: |
            Auto-built from tag ${{ github.ref_name }}.

            ## What's new in 2.1
            - **Speed control** — dedicated slider changes playback speed from 0.25× to 4× on downloads and local files (`setpts` + `atempo`, zero artifacts)
            - **Quality picker** — choose resolution (up to 4K) for MP4 or bitrate (128–320 kbps) for MP3
            - **Live preview** — ▶ Preview on the Process page plays your trim/flip/speed settings through ffplay before you commit
            - **Drag & drop** — drop a local file anywhere to load it into Process
            - **繁体中文 (Traditional Chinese)** localization for the entire UI

            ## Downloads
            - `VidGrab.exe` — single self-contained Windows executable (ffmpeg + ffplay embedded)
            - `VidGrab-linux` — self-contained Linux binary (ffmpeg + ffplay embedded, x86_64)
            - `VidGrab-linux.tar.xz` — same binary, compressed

            ## What's inside
            - YouTube downloader (MP4 / MP3 / both) via yt-dlp
            - Local file mode: flip, trim & speed MP4/MP3/MKV straight from disk
            - PySide6 (Qt) dark/light sidebar GUI, internet status, progress + log
          fail_on_unmatched_files: false
          files: |
            release/VidGrab.exe
            release/VidGrab-linux
            release/VidGrab-linux.tar.xz