name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    uses: ./.github/workflows/build-linux.yml

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VidGrab-windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: VidGrab-linux
          path: release-linux

      - name: Prepare release assets
        run: |
          mv release-linux/VidGrab "release/VidGrab-linux"
          mv release-linux/VidGrab-linux.tar.xz "release/VidGrab-linux.tar.xz"
          chmod +x "release/VidGrab-linux"
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VidGrab ${{ github.ref_name }}
          body: |
            Auto-built from tag ${{ github.ref_name }}.

            ## What's new in 2.2
            - **New brand icon** — a futuristic cyber-chip design: chamfered tile, electric blue→cyan→violet→magenta gradient, neon outline + glow, play triangle with a download chevron, and the "VidGrab" wordmark (icon shown in the README)
            - **日本語 (Japanese) and 한국어 (Korean)** — full UI localization for 4 languages total; Noto Sans CJK JP/KR fonts bundled so text renders perfectly on any OS
            - **Makefile** — `setup`/`run`/`lint`/`test`/`build`/`clean`/`icon` targets replace `run.sh`
            - **Repo polish** — build scripts consolidated under `scripts/`, session notes moved to `docs/`, `version_info.txt` derived from `_version.py`, single `requirements.txt`, zip artifact dropped

            ## Downloads
            - `VidGrab.exe` — single self-contained Windows executable (ffmpeg + ffplay embedded)
            - `VidGrab-linux` — self-contained Linux binary (ffmpeg + ffplay embedded, x86_64)
            - `VidGrab-linux.tar.xz` — same binary, compressed

            ## What's inside
            - YouTube downloader (MP4 / MP3 / both) via yt-dlp
            - Local file mode: flip, trim & speed MP4/MP3/MKV straight from disk
            - PySide6 (Qt) dark/light sidebar GUI, internet status, progress + log
          fail_on_unmatched_files: false
          files: |
            release/VidGrab.exe
            release/VidGrab-linux
            release/VidGrab-linux.tar.xz