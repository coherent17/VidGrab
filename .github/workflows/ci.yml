name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests (incl. GUI smoke under Xvfb)
        run: xvfb-run -a python -m pytest -v
        env:
          SMOKE_GUI: "1"

      - name: Ensure no FFmpeg binaries are tracked
        run: |
          BINARIES=$(git ls-files 'ffmpeg/*.exe' '*.exe' 'ffmpeg/linux/ffmpeg' 'ffmpeg/linux/ffprobe')
          if [ -n "$BINARIES" ]; then
            echo "Found tracked binaries:"; echo "$BINARIES"; exit 1
          fi

  build-windows:
    needs: test
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    needs: test
    uses: ./.github/workflows/build-linux.yml