name: Checks

# Lint + the full test suite (unit, GUI smoke, real ffmpeg renders) on Linux
# and Windows. Shared by CI and the release, so nothing is published untested.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.9.0"
      - run: ruff check .

      - name: Ensure no FFmpeg binaries are tracked
        run: |
          BINARIES=$(git ls-files 'ffmpeg/*.exe' '*.exe' 'ffmpeg/linux/*' 'ffmpeg/win/*' 'ffmpeg/mac/*')
          if [ -n "$BINARIES" ]; then
            echo "Found tracked binaries:"; echo "$BINARIES"; exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # macOS is new here and could only be tried on GitHub's runners: report it,
    # but don't block a release on it until it has proven stable
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libdbus-1-3 \
            libpulse0
          # ALSA lib was renamed libasound2 -> libasound2t64 on new Ubuntu images.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # the same pinned ffmpeg the executables ship (ffmpeg/pin.json)
      - name: Install pinned ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          python scripts/fetch_ffmpeg.py linux
          echo "$PWD/ffmpeg/linux" >> "$GITHUB_PATH"

      - name: Install pinned ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/fetch_ffmpeg.py win
          Add-Content $env:GITHUB_PATH "$PWD\ffmpeg\win"

      - name: Install pinned ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/fetch_ffmpeg.py
          echo "$PWD/ffmpeg/mac" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (incl. GUI smoke, offscreen platform)
        run: python -m pytest -v
        env:
          SMOKE_GUI: "1"
          QT_QPA_PLATFORM: "offscreen"

  # the pip package: build it, then install the wheel into an empty environment
  # and start the app from there (assets, ffmpeg pin and entry point must all work)
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libdbus-1-3 libpulse0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel into an empty environment and start it
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          PY="$RUNNER_TEMP/clean/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/clean/Scripts/python.exe"
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"   # not the checkout: the installed package must be what runs
          "$PY" -c "
          from vidgrab import app, ffmpeg_fetch, studio
          assert app._asset('icon.png').is_file() and app._asset('flags', 'us.png').is_file()
          assert studio._subtitle_font() is not None
          assert ffmpeg_fetch.load_pin()['files']
          print('assets and pin found')"
          "$PY" -m vidgrab --selftest | tee selftest.log
          grep -q "multimedia=1" selftest.log

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: pip-package
          path: dist/*
