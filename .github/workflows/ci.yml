name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  integration:
    # Real-network pipeline checks (YouTube download + ffmpeg flip/trim/speed).
    # Only on main pushes — not every PR — since they hit the live services.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          # ALSA lib was renamed libasound2 -> libasound2t64 on new Ubuntu images.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pinned ffmpeg
        run: |
          python scripts/fetch_ffmpeg.py linux
          echo "$PWD/ffmpeg/linux" >> "$GITHUB_PATH"

      - name: Run real download & processing tests
        run: python -m pytest tests/test_integration.py -v
        env:
          VIDGRAB_INTEGRATION: "1"
          QT_QPA_PLATFORM: "offscreen"

  # The builds run beside the checks (they only produce artifacts here, nothing is
  # published), so a pull request takes as long as the slower of the two. The release
  # workflow still builds only after the checks have passed.
  build-windows:
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    uses: ./.github/workflows/build-linux.yml
