name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libdbus-1-3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests (incl. GUI smoke, offscreen platform)
        run: python -m pytest -v
        env:
          SMOKE_GUI: "1"
          QT_QPA_PLATFORM: "offscreen"

      - name: Ensure no FFmpeg binaries are tracked
        run: |
          BINARIES=$(git ls-files 'ffmpeg/*.exe' '*.exe' 'ffmpeg/linux/ffmpeg' 'ffmpeg/linux/ffprobe')
          if [ -n "$BINARIES" ]; then
            echo "Found tracked binaries:"; echo "$BINARIES"; exit 1
          fi

  build-windows:
    needs: test
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    needs: test
    uses: ./.github/workflows/build-linux.yml