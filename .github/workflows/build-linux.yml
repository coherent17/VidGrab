name: Build Linux binary

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    # Build on the oldest supported Ubuntu: a PyInstaller binary only runs on
    # systems whose glibc is at least as new as the build host's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zip \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libpulse0 libxcb-cursor0
          # ALSA lib was renamed libasound2 -> libasound2t64 on new Ubuntu images.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Create build venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # the version pinned in ffmpeg/pin.json (SHA-256 checked)
      - name: Download pinned ffmpeg
        run: |
          python scripts/fetch_ffmpeg.py linux
          ffmpeg/linux/ffmpeg -hide_banner -version | head -1

      # Studio relies on libass (subtitles), amix and acrossfade: render real
      # projects with the exact ffmpeg that is about to be embedded.
      - name: Test Studio against the bundled ffmpeg
        run: PATH="$PWD/ffmpeg/linux:$PATH" .venv/bin/python -m pytest tests/test_studio.py -v

      - name: Build single-file binary
        run: .venv/bin/pyinstaller VidGrab.spec --noconfirm

      - name: Verify binary
        run: file dist/VidGrab

      - name: Selftest (multimedia availability in packaged binary)
        run: |
          QT_QPA_PLATFORM=offscreen dist/VidGrab --selftest | tee /tmp/vidgrab-selftest.log
          grep -q "multimedia=1" /tmp/vidgrab-selftest.log

      - name: Create compressed archive
        run: tar -cJf dist/VidGrab-linux.tar.xz -C dist VidGrab

      - name: Show artifact sizes
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: VidGrab-linux
          path: |
            dist/VidGrab
            dist/VidGrab-linux.tar.xz