name: Build Windows exe

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv installs the requirements several times faster than pip (pip is still what the
      # "package" jobs and the wheel check use, because that is what users run)
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Cache the pinned ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg/linux
            ffmpeg/win
            ffmpeg/mac
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('ffmpeg/pin.json') }}

      # the version pinned in ffmpeg/pin.json (SHA-256 checked)
      - name: Download pinned ffmpeg
        shell: pwsh
        run: |
          python scripts/fetch_ffmpeg.py win
          & .\ffmpeg\win\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Install Python deps
        run: uv pip install --system -r requirements.txt

      - name: Generate version info (from vidgrab/_version.py)
        run: python scripts\write_version_info.py

      - name: Build single-file exe
        run: pyinstaller VidGrab.spec --noconfirm

      - name: Selftest (multimedia availability in packaged binary)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $out = & .\dist\VidGrab.exe --selftest 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "multimedia=1") { throw "multimedia selftest failed" }
          if ($out -notmatch "captions=1") { throw "captions selftest failed" }
          if ($out -notmatch "openvino=1") { throw "openvino selftest failed" }

      - name: Show artifact sizes
        shell: pwsh
        run: Get-ChildItem "dist" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VidGrab-windows
          path: |
            dist/VidGrab.exe