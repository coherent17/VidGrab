[pytest]
pythonpath = .
testpaths = tests
# a stuck test fails after two minutes and prints every thread's stack, instead of
# holding a CI runner for hours (the slowest test takes about ten seconds)
timeout = 120
timeout_method = thread
# a test that is merely slow dumps every thread's stack (works even when Python is stuck in native code);
# the one flaky 20-minute CI hang left no trace, this is how the next one gets caught
faulthandler_timeout = 100
