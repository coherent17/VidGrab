name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    # The tag must match vidgrab/_version.py so the app, the exe resource and
    # the release all report the same version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches vidgrab/_version.py
        run: |
          APP=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' vidgrab/_version.py)
          TAG="${GITHUB_REF_NAME#v}"
          echo "app=$APP tag=$TAG"
          [ "$APP" = "$TAG" ] || { echo "::error::tag v$TAG does not match _version.py ($APP)"; exit 1; }

  # the same lint + tests as CI: a tag can't publish what doesn't pass them
  # (the live-YouTube integration tests stay CI-only: YouTube often refuses
  # GitHub's runners, which shouldn't block a release)
  checks:
    needs: check-version
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    needs: checks
    uses: ./.github/workflows/build-linux.yml
    with:
      archive: true

  build-macos:
    needs: checks
    uses: ./.github/workflows/build-macos.yml

  # the pip package. Off until the repository variable PYPI_PUBLISH is "true" and
  # PyPI has a trusted publisher for this repository (workflow: release.yml,
  # environment: pypi) -- nothing here needs a token.
  publish-pypi:
    needs: checks
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VidGrab-windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: VidGrab-linux
          path: release-linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: VidGrab-macos-*
          path: release-macos
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mv release/VidGrab.exe "release/VidGrab-windows-x64.exe"
          mv release-linux/VidGrab "release/VidGrab-linux-x64"
          mv release-linux/VidGrab-linux.tar.xz "release/VidGrab-linux-x64.tar.xz"
          chmod +x "release/VidGrab-linux-x64"
          mv release-macos/*.zip release/
          # demo video + user guide ship with every release
          cp docs/VidGrab-demo.mp4 release/
          cp docs/VidGrab-user-guide-zh-TW.pdf release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # the section between "## <version>" and the next "## " heading
          awk -v v="$VER" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}." > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads

          | Platform | File |
          |----------|------|
          | Windows 10/11 (x64) | `VidGrab-windows-x64.exe` — double-click to run |
          | Linux (x64, glibc ≥ 2.35) | `VidGrab-linux-x64` — `chmod +x` then run (or the `.tar.xz`) |
          | macOS 12+, Apple silicon | `VidGrab-macos-arm64.zip` — unzip, then right-click `VidGrab.app` → Open the first time |
          | macOS 12+, Intel | `VidGrab-macos-x64.zip` — same |
          | Any (Python 3.10+) | `pip install vidgrab-studio` (add `[captions]` for auto captions) |

          The Windows and Linux files are single, self-contained executables with ffmpeg / ffprobe embedded — nothing else to install.
          The macOS app is not signed, so macOS asks you to confirm the first launch (right-click → Open, or
          `xattr -dr com.apple.quarantine VidGrab.app`); it downloads ffmpeg once, with your OK, on first use.
          Verify downloads with `SHA256SUMS.txt`.

          ### 示範影片與使用手冊 (Demo & user guide)

          - 🎬 `VidGrab-demo.mp4`: 示範影片（繁體中文旁白，約 3 分鐘）
          - 📘 `VidGrab-user-guide-zh-TW.pdf`: 使用手冊（繁體中文 PDF）
          EOF
          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VidGrab ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
