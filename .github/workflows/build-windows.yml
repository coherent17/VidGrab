name: Build Windows exe

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg (BtbN static)
        shell: pwsh
        run: |
          # GitHub-hosted mirror (gyan.dev is flaky from CI: intermittent 503s)
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-unpacked" -Force
          $ffmpeg = Get-ChildItem -Recurse "ffmpeg-unpacked" -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse "ffmpeg-unpacked" -Filter "ffprobe.exe" | Select-Object -First 1
          $ffplay = Get-ChildItem -Recurse "ffmpeg-unpacked" -Filter "ffplay.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg.exe or ffprobe.exe not found in archive" }
          if (-not $ffplay) { throw "ffplay.exe not found in archive" }
          New-Item -ItemType Directory -Force "ffmpeg\win" | Out-Null
          Copy-Item $ffmpeg.FullName "ffmpeg\win\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "ffmpeg\win\ffprobe.exe"
          Copy-Item $ffplay.FullName "ffmpeg\win\ffplay.exe"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate version info (from vidgrab/_version.py)
        run: python scripts\write_version_info.py

      - name: Build single-file exe
        run: pyinstaller VidGrab.spec --noconfirm

      - name: Selftest (multimedia availability in packaged binary)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $out = & .\dist\VidGrab.exe --selftest 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "multimedia=1") { throw "multimedia selftest failed" }

      - name: Show artifact sizes
        shell: pwsh
        run: Get-ChildItem "dist" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VidGrab-windows
          path: |
            dist/VidGrab.exe