name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (tkinter + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Ensure no FFmpeg binaries are tracked in git
        run: |
          BINARIES=$(git ls-files 'ffmpeg/*.exe' '*.exe')
          if [ -n "$BINARIES" ]; then
            echo "Found tracked binaries, refusing to ship them:"; echo "$BINARIES"; exit 1
          fi

  build-windows:
    needs: test
    uses: ./.github/workflows/build-windows.yml