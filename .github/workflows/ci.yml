name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.9.0"
      - run: ruff check .

      - name: Ensure no FFmpeg binaries are tracked
        run: |
          BINARIES=$(git ls-files 'ffmpeg/*.exe' '*.exe' 'ffmpeg/linux/*' 'ffmpeg/win/*')
          if [ -n "$BINARIES" ]; then
            echo "Found tracked binaries:"; echo "$BINARIES"; exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libdbus-1-3 \
            libpulse0
          # ALSA lib was renamed libasound2 -> libasound2t64 on new Ubuntu images.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install ffmpeg (Windows, BtbN static)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $bin = (Get-ChildItem -Recurse "$env:RUNNER_TEMP\ffmpeg" -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (incl. GUI smoke, offscreen platform)
        run: python -m pytest -v
        env:
          SMOKE_GUI: "1"
          QT_QPA_PLATFORM: "offscreen"

  integration:
    # Real-network pipeline checks (YouTube download + ffmpeg flip/trim/speed).
    # Only on main pushes — not every PR — since they hit the live services.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpulse0
          # ALSA lib was renamed libasound2 -> libasound2t64 on new Ubuntu images.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run real download & processing tests
        run: python -m pytest tests/test_integration.py -v
        env:
          VIDGRAB_INTEGRATION: "1"
          QT_QPA_PLATFORM: "offscreen"

  build-windows:
    needs: [lint, test]
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    needs: [lint, test]
    uses: ./.github/workflows/build-linux.yml
