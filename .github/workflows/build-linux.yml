name: Build Linux binary

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv zip \
            libegl1 libgl1 libxkbcommon0 libfontconfig1

      - name: Create build venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Download static ffmpeg
        run: |
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o ffmpeg-release-amd64-static.tar.xz
          # Integrity check: must be a real XZ archive (magic bytes fd 37 7a 58 5a 00)
          head -c 6 ffmpeg-release-amd64-static.tar.xz | grep -q $'\xfd7zXZ\x00' || {
            echo "ERROR: downloaded file is not a valid XZ archive"
            file ffmpeg-release-amd64-static.tar.xz || true
            exit 1
          }
          tar -xJf ffmpeg-release-amd64-static.tar.xz
          mkdir -p ffmpeg/linux
          cp ffmpeg-*-amd64-static/ffmpeg  ffmpeg/linux/ffmpeg
          cp ffmpeg-*-amd64-static/ffprobe ffmpeg/linux/ffprobe
          chmod +x ffmpeg/linux/ffmpeg ffmpeg/linux/ffprobe
          rm -f ffmpeg-release-amd64-static.tar.xz

      - name: Generate icon
        run: .venv/bin/python scripts/generate_icon.py

      - name: Build single-file binary
        run: .venv/bin/pyinstaller VidGrab.spec --noconfirm

      - name: Verify binary
        run: file dist/VidGrab

      - name: Create compressed archive
        run: tar -cJf dist/VidGrab-linux.tar.xz -C dist VidGrab

      - name: Show artifact sizes
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: VidGrab-linux
          path: |
            dist/VidGrab
            dist/VidGrab-linux.tar.xz